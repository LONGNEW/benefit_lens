name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y zstd
      - run: python -m pip install -r pipeline/requirements.lock -e pipeline
      - run: python -m pytest pipeline/tests tools/tests -q
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r pipeline/requirements.lock -e pipeline
      - run: make init && make db-up && make sample-db
      - run: make sample-db && make smoke
