services:
  postgres:
    image: postgres:16-alpine
    container_name: benefitlens-postgres
    environment:
      # Keep the physical database role and database for the existing local volume.
      # The application schema is migrated from `unlock` to `benefitlens`.
      POSTGRES_DB: unlock
      POSTGRES_USER: unlock
      POSTGRES_PASSWORD: unlock_local_dev
    ports:
      - "127.0.0.1:${BENEFITLENS_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unlock -d unlock"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - benefitlens_postgres_data:/var/lib/postgresql/data

volumes:
  benefitlens_postgres_data:
    name: unlock_unlock_postgres_data
