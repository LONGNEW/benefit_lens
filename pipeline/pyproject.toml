[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "benefitlens-data-pipeline"
version = "0.1.0"
description = "PostgreSQL-backed collection pipeline for support opportunities"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "psycopg[binary]>=3.2,<4",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "jsonschema>=4.10,<5"]

[project.scripts]
benefitlens-pipeline = "data_platform.cli:entrypoint"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
